<section class="mx-auto max-w-2xl space-y-6">
  <header>
    <h1 class="text-2xl font-semibold text-slate-900">Agregar documento</h1>
    <p class="text-sm text-slate-500">Registra un nuevo documento en la biblioteca.</p>
  </header>

  @if (mensaje(); as texto) {
    <div
      class="flex items-center justify-between rounded-md border border-green-200 bg-green-50 px-4 py-3 text-sm text-green-800"
      role="status"
    >
      <span>{{ texto }}</span>
      <a routerLink="/buscar" class="font-medium underline">Ver en búsqueda</a>
    </div>
  }

  <form
    class="grid gap-4 rounded-lg border border-slate-200 bg-white p-6 shadow-sm sm:grid-cols-2"
    [formGroup]="formulario"
    (ngSubmit)="guardar(false)"
    novalidate
  >
    <label class="flex flex-col gap-1 text-sm font-medium text-slate-700 sm:col-span-2">
      Título *
      <input
        formControlName="titulo"
        class="rounded-md border border-slate-300 px-3 py-2 font-normal focus:border-indigo-500 focus:outline-none"
        [class.border-red-500]="invalido('titulo')"
      />
      @if (invalido('titulo')) {
        <span class="text-xs font-normal text-red-600">El título es obligatorio (máx. 200 caracteres).</span>
      }
    </label>

    <label class="flex flex-col gap-1 text-sm font-medium text-slate-700 sm:col-span-2">
      Autor / Compositor *
      <input
        formControlName="autor"
        class="rounded-md border border-slate-300 px-3 py-2 font-normal focus:border-indigo-500 focus:outline-none"
        [class.border-red-500]="invalido('autor')"
      />
      @if (invalido('autor')) {
        <span class="text-xs font-normal text-red-600">El autor es obligatorio (máx. 120 caracteres).</span>
      }
    </label>

    <label class="flex flex-col gap-1 text-sm font-medium text-slate-700">
      Tipo *
      <select
        formControlName="tipo"
        class="rounded-md border border-slate-300 px-3 py-2 font-normal focus:border-indigo-500 focus:outline-none"
        [class.border-red-500]="invalido('tipo')"
      >
        <option value="" disabled>Selecciona un tipo</option>
        @for (t of tipos; track t) {
          <option [value]="t">{{ t }}</option>
        }
      </select>
      @if (invalido('tipo')) {
        <span class="text-xs font-normal text-red-600">Selecciona un tipo.</span>
      }
    </label>

    <label class="flex flex-col gap-1 text-sm font-medium text-slate-700">
      Año *
      <input
        type="number"
        formControlName="anio"
        class="rounded-md border border-slate-300 px-3 py-2 font-normal focus:border-indigo-500 focus:outline-none"
        [class.border-red-500]="invalido('anio')"
      />
      @if (invalido('anio')) {
        <span class="text-xs font-normal text-red-600">Ingresa un año entre 1000 y {{ anioMaximo }}.</span>
      }
    </label>

    <label class="flex flex-col gap-1 text-sm font-medium text-slate-700 sm:col-span-2">
      Género
      <input
        formControlName="genero"
        placeholder="Ej. Barroco, Jazz, Rock…"
        class="rounded-md border border-slate-300 px-3 py-2 font-normal focus:border-indigo-500 focus:outline-none"
      />
    </label>

    <label class="flex flex-col gap-1 text-sm font-medium text-slate-700 sm:col-span-2">
      Descripción
      <textarea
        formControlName="descripcion"
        rows="4"
        class="rounded-md border border-slate-300 px-3 py-2 font-normal focus:border-indigo-500 focus:outline-none"
      ></textarea>
    </label>

    <div class="flex flex-wrap justify-end gap-2 sm:col-span-2">
      <button
        type="button"
        class="rounded-md border border-slate-300 px-4 py-2 text-sm text-slate-700 hover:bg-slate-100"
        (click)="cancelar()"
      >
        Limpiar
      </button>
      <button
        type="button"
        class="rounded-md border border-indigo-600 px-4 py-2 text-sm font-medium text-indigo-700 hover:bg-indigo-50"
        (click)="guardar(true)"
      >
        Guardar y agregar otro
      </button>
      <button
        type="submit"
        class="rounded-md bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-700"
      >
        Guardar
      </button>
    </div>
  </form>
</section>
