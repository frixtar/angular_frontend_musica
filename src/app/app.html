<div class="min-h-screen bg-slate-50">
  <header class="border-b border-slate-200 bg-white">
    <nav class="mx-auto flex max-w-5xl flex-wrap items-center justify-between gap-4 px-4 py-3">
      <a routerLink="/" class="text-lg font-bold text-indigo-700">Biblioteca Musical</a>
      <ul class="flex gap-1">
        @for (enlace of enlaces; track enlace.ruta) {
          <li>
            <a
              [routerLink]="enlace.ruta"
              routerLinkActive="bg-indigo-50 text-indigo-700"
              ariaCurrentWhenActive="page"
              class="rounded-md px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100"
            >
              {{ enlace.etiqueta }}
            </a>
          </li>
        }
      </ul>
    </nav>
  </header>

  <main class="mx-auto max-w-5xl px-4 py-8">
    <router-outlet />
  </main>
</div>
